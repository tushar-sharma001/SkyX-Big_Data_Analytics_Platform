# docker-compose.yml
# ---------------------------------------------------------------------------
# Real streaming infrastructure for the "big data ingestion/processing at
# scale" requirement. This replaces the honest gap flagged earlier
# ("bounded demo scale, not literal Kafka/Spark") with an actual Kafka +
# Spark Structured Streaming pipeline you can stand up locally.
#
# Topology once running:
#   connectors + citizen app POSTs --> kafka_producer.py --> Kafka topic
#   "weather-reports" --> spark_consumer.py (Structured Streaming,
#   micro-batch) --> ml/pipeline.py (classification, fake-detection,
#   dedup, IMD corroboration) --> backend/weatherpulse.db (or swap for
#   Postgres at real production scale)
#
# Run:  docker compose up -d
# Then: python3 backend/streaming/kafka_producer.py   (feeds the topic)
#       python3 backend/streaming/spark_consumer.py   (processes it)
#
# This is optional infrastructure — the default `./run.sh` path still runs
# the whole platform in a single process with an in-memory queue for
# environments where standing up Kafka isn't practical (e.g. this sandbox,
# or a quick judge demo on a laptop). Use docker-compose when you want to
# demonstrate the literal streaming architecture.
# ---------------------------------------------------------------------------
version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: weatherpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
